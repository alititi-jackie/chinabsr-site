<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8f9">
<title>China BSR · 蓝天救援公益科普</title>
<meta name="description" content="China BSR 是一个独立的公益科普信息平台，致力于向公众介绍蓝天救援队的发展、故事与救援精神。">
<meta property="og:title" content="China BSR · 蓝天救援公益科普">
<meta property="og:description" content="了解民间救援力量的故事。本频道为非官方账号，仅用于公益介绍与信息分享。">
<link rel="canonical" href="https://chinabsr.org/">
<style>
* {box-sizing:border-box}
:root {color-scheme:light; --ink:#102b41; --blue:#075c91; --muted:#455d6c}
body {margin:0; background:#f6f8f9; color:var(--ink); font:1rem/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap {width:min(88%,72rem); margin:auto}
header {border-bottom:1px solid #c6d3db}
header .wrap {display:flex; justify-content:space-between; align-items:center; padding:1.1rem 0}
.brand {font-size:1.16rem; letter-spacing:-.045em; font-weight:750}
.brand span {color:var(--blue)}
button {font:inherit; color:var(--ink); background:transparent; border:1px solid #a6b8c5; border-radius:2rem; padding:.45rem 1rem; cursor:pointer}
.hero {padding:clamp(2.4rem,5vw,5rem) 0; display:grid; grid-template-columns:.95fr 1fr; align-items:center; gap:clamp(2rem,7vw,6rem)}
h1 {font-size:clamp(3.4rem,7vw,6.5rem); font-weight:780; letter-spacing:-.075em; line-height:1; margin:0}
h1 span {color:var(--blue)}
h2 {font-size:clamp(1.45rem,2.7vw,2.5rem); letter-spacing:.045em; margin:.65rem 0 0}
.intro {font-size:1.1rem; line-height:1.95; margin:0; text-wrap:pretty}
.notice {color:var(--muted); margin:.9rem 0 0; font-size:.94rem}
.cta {display:inline-flex; align-items:center; gap:1rem; text-decoration:none; color:white; background:var(--blue); border-radius:.45rem; margin-top:1.35rem; padding:.65rem 1.15rem; font-weight:650}
.cta:hover {background:#08446b}
a:focus-visible,button:focus-visible {outline:3px solid #0089b9; outline-offset:4px}
figure {margin:0 auto 2rem; background:#102e46; color:#fff; display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); border-radius:.8rem; overflow:hidden}
figure img {display:block; width:100%; height:auto}
figcaption {padding:clamp(1.3rem,3.6vw,3.2rem); align-self:end}
.place {display:block; font-size:.94rem; color:#bcdbee}
figcaption h3 {font-size:clamp(1.5rem,2.9vw,2.65rem); line-height:1.4; margin:.75rem 0}
.credit {font-size:.85rem; color:#d0e1eb; margin:1.4rem 0 0}
.credit a {color:inherit; text-underline-offset:.2em}
@media(max-width:740px){.hero,figure{grid-template-columns:1fr}.hero{gap:1.4rem}.wrap{width:90%}figcaption{padding:1.15rem 1.3rem}.credit{margin-top:.75rem}.intro{font-size:1.02rem}.notice{font-size:.9rem}figure{margin-bottom:1.25rem}}
</style>
</head>
<body>
<header><div class="wrap"><strong class="brand">chinabsr<span>.org</span></strong><button id="share" hidden>分享网址</button></div></header>
<main class="wrap">
<section class="hero" aria-labelledby="title">
<div><h1 id="title">China <span>BSR</span></h1><h2>蓝天救援公益科普</h2></div>
<div><p class="intro">China BSR 是一个独立的公益科普信息平台，致力于向公众介绍蓝天救援队（Blue Sky Rescue）的发展、故事与救援精神，让更多人了解民间救援力量的重要价值。</p>
<p class="notice">本频道为非官方账号，仅用于公益介绍与信息分享。</p>
<a class="cta" href="https://www.youtube.com/@Chinabsr">观看 YouTube 频道 <span aria-hidden="true">↗</span></a></div>
</section>
<figure>
<img src="assets/adiyaman.jpg" width="800" height="557" alt="中国蓝天救援队员与伊朗搜救人员在地震废墟中协作">
<figcaption><span class="place">2023 年 2 月 · 土耳其阿德亚曼</span>
<h3>地震救援现场</h3>
中国蓝天救援队与伊朗搜救人员在废墟中共同开展救援。
<p class="credit">摄影：Hossein Velayati / Tasnim News Agency<br>
<a href="https://commons.wikimedia.org/wiki/File:Chinese_Blue_Sky_and_Iranian_search_and_rescue_teams_are_in_Ad%C4%B1yaman,_which_was_affected_by_the_earthquakes.jpg">照片来源</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p></figcaption>
</figure>
</main>
<script>
const share = document.getElementById('share');
share.hidden = false;
share.addEventListener('click', async () => {
  const url = 'https://chinabsr.org/';
  try {
    if (navigator.share) {
      await navigator.share({title:'China BSR 公益科普平台',url});
    } else {
      await navigator.clipboard.writeText(url);
      share.textContent = '网址已复制';
    }
  } catch (error) {
    if (error.name !== 'AbortError') window.prompt('复制频道网址',url);
  }
});
</script></body></html>
