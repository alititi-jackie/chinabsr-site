<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8f9">
<title>China BSR · 中国蓝天救援公益科普</title>
<meta name="description" content="China BSR 是一个独立的公益科普信息平台，致力于向公众介绍蓝天救援队的发展、故事与救援精神。">
<meta property="og:title" content="China BSR · 中国蓝天救援公益科普">
<meta property="og:description" content="了解民间救援力量的故事。本频道为非官方账号，仅用于公益介绍与信息分享。">
<link rel="canonical" href="https://chinabsr.org/">
<style>
* {box-sizing:border-box}
:root {color-scheme:light; --ink:#102b41; --blue:#075c91; --muted:#455d6c}
body {margin:0; background:#f6f8f9; color:var(--ink); font:1rem/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap {width:min(88%,72rem); margin:auto}
header {border-bottom:1px solid #c6d3db}
header .wrap {display:flex; justify-content:space-between; align-items:center; padding:1.1rem 0}
.brand {font-size:1.16rem; letter-spacing:-.045em; font-weight:750}
.brand span {color:var(--blue)}
button {font:inherit; color:var(--ink); background:transparent; border:1px solid #a6b8c5; border-radius:2rem; padding:.45rem 1rem; cursor:pointer}
main.hero {position:relative;isolation:isolate;overflow:hidden;background:#102739;color:white;min-height:calc(100svh - 70px);display:flex;flex-direction:column}
.slides,.slides a,.slides img,.hero::before {position:absolute;inset:0;width:100%;height:100%}
.slides {z-index:-2}
.slides a {opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.slides a.active {opacity:1;pointer-events:auto}
.slides img {object-fit:cover;object-position:center 48%}
.hero::before {content:"";z-index:-1;pointer-events:none;background:linear-gradient(90deg,#081c30eb 0%,#0a2133a8 40%,transparent 90%),linear-gradient(0deg,#051624bd,transparent 30%)}
.copy {margin:0 auto auto;padding:clamp(2rem,5vw,5rem) 0 2rem;pointer-events:none}
h1 {margin:0;line-height:1.08;font-size:clamp(3.2rem,7vw,6.6rem);letter-spacing:-.065em}
h1 span {display:block;font-size:clamp(1.8rem,3.4vw,3.3rem);letter-spacing:.035em;margin-top:.32em}
.intro {max-width:32rem;font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.85;margin:1.5rem 0 .7rem}
.notice {margin:0;font-size:.93rem}
.cta {pointer-events:auto;display:inline-flex;align-items:center;gap:1.25rem;color:#133246;background:white;text-decoration:none;font-weight:700;margin-top:1.4rem;padding:.65rem 1.25rem;border-radius:.4rem}
.controls {margin:0 auto;padding:1rem 0;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.credit {font-size:.85rem;color:white;text-underline-offset:3px}
.nav[hidden] {display:none}
.nav {display:flex;align-items:center}
.nav button {color:white;background:#11273c80;border:0;min-height:44px;min-width:44px;padding:0;font-size:1rem}
.nav button[data-slide]::before {content:"";display:inline-block;border-radius:1rem;background:#c7d3db;width:8px;height:8px}
.nav button[aria-current=true]::before {width:24px;background:white}
a:focus-visible,button:focus-visible {outline:3px solid #ffbf66;outline-offset:2px}
@media(max-width:650px){.wrap{width:90%}.hero::before{background:linear-gradient(180deg,#081d31df,#10283fa3 55%,#0b24345c 70%,#091c2bbb)}.copy{padding-top:1.8rem}.intro{max-width:27rem}.controls{gap:.3rem}.nav{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.slides a{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><strong class="brand">chinabsr<span>.org</span></strong><button id="share" hidden>分享网址</button></div></header>
<main class="hero" aria-labelledby="title">
<div class="slides">
<a class="active" href="https://commons.wikimedia.org/wiki/File:Chinese_Blue_Sky_and_Iranian_search_and_rescue_teams_are_in_Ad%C4%B1yaman,_which_was_affected_by_the_earthquakes.jpg" tabindex="-1"><img src="assets/adiyaman.jpg" alt="中国蓝天救援队与伊朗搜救人员在土耳其地震现场开展救援" fetchpriority="high"></a>
<a href="https://www.flickr.com/photos/154940827@N06/55446867309/" tabindex="-1" aria-hidden="true"><img src="https://live.staticflickr.com/65535/55446867309_1d71c9458b_b.jpg" alt="蓝天救援队在肯尼亚搜救培训活动现场"></a>
<a href="https://www.flickr.com/photos/154940827@N06/55171676105/" tabindex="-1" aria-hidden="true"><img src="https://live.staticflickr.com/65535/55171676105_6e2d8d3ded_b.jpg" alt="中国蓝天救援队与肯尼亚红十字会人员在交流活动中合影"></a>
</div>
<section class="wrap copy"><h1 id="title">China BSR<span>中国蓝天救援</span></h1>
<p class="intro">China BSR 是一个独立的公益科普信息平台，致力于向公众介绍蓝天救援队（Blue Sky Rescue）的发展、故事与救援精神，让更多人了解民间救援力量的重要价值。</p>
<p class="notice">本频道为非官方账号，仅用于公益介绍与信息分享。</p>
<a class="cta" href="https://www.youtube.com/@Chinabsr">观看 YouTube 频道 <span aria-hidden="true">↗</span></a></section>
<div class="wrap controls"><div><a class="credit" id="credit" href="https://commons.wikimedia.org/wiki/File:Chinese_Blue_Sky_and_Iranian_search_and_rescue_teams_are_in_Ad%C4%B1yaman,_which_was_affected_by_the_earthquakes.jpg">土耳其地震救援 · Hossein Velayati / Tasnim</a> <a class="credit" id="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></div>
<div class="nav" aria-label="背景照片切换" hidden>
<button data-slide="0" aria-current="true" aria-label="显示地震救援现场"></button>
<button data-slide="1" aria-label="显示搜救培训现场"></button>
<button data-slide="2" aria-label="显示救援队交流合影"></button>
<button id="pause" aria-label="暂停轮播">Ⅱ</button>
</div></div></main>
<script>
const share = document.getElementById('share');
share.hidden = false;
share.addEventListener('click', async () => {
  const url = 'https://chinabsr.org/';
  try {
    if (navigator.share) {
      await navigator.share({title:'China BSR 公益科普平台',url});
    } else {
      await navigator.clipboard.writeText(url);
      share.textContent = '网址已复制';
    }
  } catch (error) {
    if (error.name !== 'AbortError') window.prompt('复制频道网址',url);
  }
});

const slides = [...document.querySelectorAll('.slides a')];
const dots = [...document.querySelectorAll('[data-slide]')];
const captions = ['土耳其地震救援 · Hossein Velayati / Tasnim', '肯尼亚搜救培训 · Kenya Red Cross / Flickr', '蓝天救援队交流合影 · Kenya Red Cross / Flickr'];
const credit = document.querySelector('#credit');
const pause = document.querySelector('#pause');
let current = 0;
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
let timer;
function show(index) {
  if (!slides[index].querySelector('img').naturalWidth) return;
  current = index;
  slides.forEach((slide, i) => {
    slide.classList.toggle('active', i === current);
    slide.setAttribute('aria-hidden', String(i !== current));
    dots[i].setAttribute('aria-current', String(i === current));
  });
  credit.href = slides[index].href;
  credit.textContent = captions[index];
  document.querySelector('#license').hidden = index !== 0;
}
function restart() {
  clearInterval(timer);
  pause.textContent = paused ? '▷' : 'Ⅱ';
  pause.setAttribute('aria-label', paused ? '播放轮播' : '暂停轮播');
  if (paused || document.hidden) return;
  timer = setInterval(() => {
    for (let step = 1; step < slides.length; step++) {
      const next = (current + step) % slides.length;
      if (slides[next].querySelector('img').naturalWidth) { show(next); break; }
    }
  }, 5000);
}
dots.forEach((dot, i) => dot.addEventListener('click', () => { show(i); restart(); }));
pause.addEventListener('click', () => { paused = !paused; restart(); });
document.addEventListener('visibilitychange', restart);
document.querySelector('.nav').hidden = false;
restart();
</script></body></html>
